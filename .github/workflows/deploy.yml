name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Install wasm-bindgen-cli (matching Cargo.lock version)
        run: |
          WASM_BINDGEN_VERSION=$(
            grep -A 2 '^name = "wasm-bindgen"$' Cargo.lock \
              | grep '^version' \
              | head -1 \
              | sed 's/version = "\(.*\)"/\1/'
          )
          echo "Installing wasm-bindgen-cli $WASM_BINDGEN_VERSION"
          if ! wasm-bindgen --version 2>/dev/null | grep -qF "$WASM_BINDGEN_VERSION"; then
            cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked --force
          else
            echo "wasm-bindgen-cli $WASM_BINDGEN_VERSION already installed, skipping."
          fi

      - name: Build game for WebAssembly
        run: cargo build --profile wasm-release --target wasm32-unknown-unknown

      - name: Generate WASM bindings
        run: |
          mkdir -p dist
          wasm-bindgen \
            --out-dir dist \
            --target web \
            --no-typescript \
            target/wasm32-unknown-unknown/wasm-release/alvorada.wasm

      - name: Copy web assets
        run: cp web/index.html dist/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
